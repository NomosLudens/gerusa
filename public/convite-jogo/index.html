<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050607" />
    <title>KALLISTIS — O Chamado</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #050607;
        --graphite: #0d1012;
        --stone: #171b1e;
        --white: #f4f7f8;
        --cold: #9aa4aa;
        --line: rgba(226, 237, 242, 0.22);
        --line-strong: rgba(226, 237, 242, 0.48);
        --glow: rgba(214, 231, 238, 0.14);
        --glow-strong: rgba(226, 241, 247, 0.3);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
        font-family: Arial, "Helvetica Neue", sans-serif;
        color: var(--white);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      button {
        font: inherit;
      }
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background-color: #050607;
        background-image:
          radial-gradient(
            ellipse at 50% 42%,
            rgba(27, 32, 35, 0.62) 0%,
            rgba(11, 13, 15, 0.86) 52%,
            #030405 92%
          ),
          image-set(
            url("/convite/crystal/optimized/fundolindo.webp") type("image/webp"),
            url("/convite/crystal/fundolindo.png") type("image/png")
          );
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        isolation: isolate;
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.11;
        pointer-events: none;
        background-image:
          repeating-linear-gradient(
            115deg,
            transparent 0 9px,
            rgba(255, 255, 255, 0.035) 10px 11px
          ),
          repeating-linear-gradient(25deg, transparent 0 16px, rgba(255, 255, 255, 0.02) 17px 18px);
      }
      #particles {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 34%,
          rgba(0, 0, 0, 0.3) 70%,
          rgba(0, 0, 0, 0.78) 100%
        );
        transition:
          background 0.45s ease,
          opacity 0.45s;
      }
      .flash {
        position: absolute;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
      }
      .flash.hit {
        animation: flash 0.52s ease;
      }
      @keyframes flash {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 0.13;
        }
        100% {
          opacity: 0;
        }
      }
      #distort {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 5px,
          rgba(255, 255, 255, 0.024) 6px 7px
        );
      }
      #distort.active {
        animation: distort 0.55s steps(2, end);
      }
      @keyframes distort {
        0% {
          opacity: 0;
          transform: translateX(0);
        }
        25% {
          opacity: 0.6;
          transform: translateX(-2px);
        }
        50% {
          opacity: 0.18;
          transform: translateX(2px);
        }
        75% {
          opacity: 0.45;
          transform: translateX(-1px);
        }
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(28px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.7s ease;
        z-index: 2;
      }
      .screen.active {
        opacity: 1;
        visibility: visible;
      }
      #loading {
        z-index: 10;
        background: var(--black);
      }
      .loading-mark {
        font-size: 0.72rem;
        letter-spacing: 0.52em;
        color: var(--cold);
        margin-bottom: 22px;
      }
      .loading-track {
        height: 1px;
        width: min(58vw, 220px);
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .loading-fill {
        height: 100%;
        width: 0;
        background: var(--white);
        box-shadow: 0 0 12px var(--glow);
        transition: width 0.45s ease;
      }
      .loading-copy {
        margin-top: 16px;
        font-size: 0.66rem;
        letter-spacing: 0.16em;
        color: #677077;
      }
      #title {
        text-align: center;
      }
      .title-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 12px 0 10px;
        max-width: min(88vw, 440px);
      }
      .wordmark {
        width: 100%;
        max-width: min(84vw, 400px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 24px rgba(226, 241, 247, 0.22));
        display: block;
      }
      .eyebrow {
        font-size: 0.64rem;
        letter-spacing: 0.5em;
        color: var(--cold);
        margin-bottom: 14px;
      }
      .subtitle {
        font-size: 0.72rem;
        letter-spacing: 0.55em;
        color: var(--cold);
        margin: 14px 0 48px;
        padding-left: 0.55em;
      }
      .action,
      .choice {
        min-height: 54px;
        border: 1px solid var(--line);
        background: rgba(12, 15, 17, 0.58);
        color: var(--white);
        letter-spacing: 0.22em;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.2s,
          box-shadow 0.25s;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .action {
        min-width: 190px;
        padding: 0 28px;
        font-size: 0.75rem;
      }
      .action:active,
      .choice:active {
        transform: scale(0.98);
        background: rgba(235, 244, 247, 0.09);
        border-color: rgba(235, 244, 247, 0.55);
      }
      .action.glow {
        box-shadow: 0 0 24px rgba(225, 239, 243, 0.06);
      }
      .sound-toggle {
        position: absolute;
        top: calc(18px + env(safe-area-inset-top));
        right: 20px;
        border: 0;
        background: transparent;
        color: #596166;
        font-size: 0.55rem;
        letter-spacing: 0.18em;
        padding: 10px;
        z-index: 6;
      }
      .sound-toggle.on {
        color: #9da7ac;
      }
      .scene {
        justify-content: flex-end;
      }
      .crystal-stage {
        position: absolute;
        top: calc(28px + env(safe-area-inset-top));
        bottom: max(180px, 30vh);
        left: 50%;
        transform: translateX(-50%);
        width: min(78vw, 360px);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 0;
        transition:
          opacity 0.7s,
          transform 0.7s,
          filter 0.7s;
      }
      .crystal-art {
        height: 100%;
        max-height: 100%;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        pointer-events: none;
        opacity: 0.78;
        filter: brightness(0.92) contrast(1.06) drop-shadow(0 0 16px rgba(180, 195, 205, 0.12));
        transition:
          opacity 0.7s,
          filter 0.7s,
          transform 0.7s;
      }
      .crystal-stage.stage-2 .crystal-art {
        opacity: 0.86;
        filter: brightness(1.02) contrast(1.1) drop-shadow(0 0 24px rgba(210, 230, 240, 0.2));
      }
      .crystal-stage.stage-3 .crystal-art {
        opacity: 0.94;
        filter: brightness(1.12) contrast(1.15) drop-shadow(0 0 32px rgba(225, 240, 248, 0.32));
      }
      .crystal-stage.stage-4 .crystal-art {
        opacity: 1;
        filter: brightness(1.22) contrast(1.2) drop-shadow(0 0 44px rgba(235, 245, 250, 0.45));
      }
      .rift {
        position: absolute;
        z-index: 1;
        top: 6%;
        bottom: 6%;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: linear-gradient(
          transparent,
          rgba(225, 239, 243, 0.7) 25%,
          rgba(255, 255, 255, 0.9) 54%,
          rgba(205, 222, 228, 0.18) 88%,
          transparent
        );
        box-shadow:
          0 0 8px rgba(225, 239, 243, 0.22),
          0 0 46px rgba(225, 239, 243, 0.09);
        opacity: 0.58;
        animation: breathe 4s ease-in-out infinite;
        transition:
          width 0.7s,
          opacity 0.7s,
          box-shadow 0.7s,
          filter 0.7s,
          transform 0.45s;
        pointer-events: none;
      }
      .rift:before,
      .rift:after {
        content: "";
        position: absolute;
        width: 1px;
        background: var(--line);
        transform-origin: top;
      }
      .rift:before {
        height: 38%;
        top: 21%;
        left: -10px;
        transform: rotate(4deg);
      }
      .rift:after {
        height: 29%;
        top: 50%;
        left: 12px;
        transform: rotate(-6deg);
      }
      .rift.stage-2 {
        opacity: 0.75;
        box-shadow:
          0 0 12px rgba(225, 239, 243, 0.3),
          0 0 65px rgba(225, 239, 243, 0.14);
      }
      .rift.stage-3 {
        opacity: 0.92;
        width: 3px;
        box-shadow:
          0 0 16px rgba(225, 239, 243, 0.38),
          0 0 95px rgba(225, 239, 243, 0.18);
      }
      .rift.stage-4 {
        opacity: 1;
        width: 4px;
        filter: brightness(1.18);
        box-shadow:
          0 0 24px rgba(225, 239, 243, 0.45),
          0 0 135px rgba(225, 239, 243, 0.24);
      }
      .rift.react-touch {
        animation: touchPulse 0.62s ease;
      }
      @keyframes touchPulse {
        35% {
          width: 10px;
          filter: brightness(1.5);
        }
      }
      .rift.react-listen {
        animation: listenPulse 0.85s ease;
      }
      @keyframes listenPulse {
        40% {
          box-shadow:
            0 0 22px rgba(225, 239, 243, 0.5),
            0 0 150px rgba(225, 239, 243, 0.22);
        }
      }
      .rift.react-advance {
        animation: advancePulse 0.48s ease;
      }
      @keyframes advancePulse {
        50% {
          transform: translateX(-50%) scaleY(1.06);
        }
      }
      .rift.react-hesitate {
        animation: hesitatePulse 1.1s ease;
      }
      @keyframes hesitatePulse {
        35% {
          opacity: 0.18;
        }
        70% {
          opacity: 0.95;
        }
      }
      @keyframes breathe {
        50% {
          opacity: 1;
          box-shadow:
            0 0 13px rgba(225, 239, 243, 0.3),
            0 0 70px rgba(225, 239, 243, 0.12);
        }
      }
      .scene-index {
        position: absolute;
        top: calc(24px + env(safe-area-inset-top));
        left: 24px;
        font-size: 0.6rem;
        letter-spacing: 0.32em;
        color: #697279;
      }
      .trace {
        position: absolute;
        top: calc(48px + env(safe-area-inset-top));
        right: 24px;
        font-size: 0.54rem;
        letter-spacing: 0.22em;
        color: #50595e;
        text-align: right;
      }
      .mark {
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: 72px;
        height: 72px;
        opacity: 0;
        transition:
          opacity 0.6s,
          transform 0.6s;
        filter: drop-shadow(0 0 16px rgba(230, 242, 246, 0.15));
        z-index: 2;
      }
      .mark.show {
        opacity: 0.65;
        transform: translateX(-50%) scale(1);
      }
      .mark svg {
        width: 100%;
        height: 100%;
      }
      .mark line,
      .mark path,
      .mark circle,
      .mark polygon {
        stroke: rgba(230, 242, 246, 0.72);
        stroke-width: 1;
        fill: none;
      }
      .dialog {
        width: 100%;
        max-width: 520px;
        border-top: 1px solid var(--line);
        padding: 20px 2px 4px;
        min-height: 154px;
        position: relative;
        background: linear-gradient(180deg, rgba(5, 6, 7, 0), rgba(5, 6, 7, 0.52));
        z-index: 3;
      }
      .speaker {
        font-size: 0.61rem;
        letter-spacing: 0.36em;
        color: #778087;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .dialog-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.18rem, 5.2vw, 1.48rem);
        line-height: 1.55;
        color: var(--white);
        min-height: 76px;
      }
      .tap-hint {
        font-size: 0.58rem;
        letter-spacing: 0.22em;
        color: #626b70;
        text-align: right;
        opacity: 0;
        transition: opacity 0.25s;
      }
      .tap-hint.show {
        opacity: 1;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .choices {
        display: none;
        width: 100%;
        max-width: 520px;
        gap: 10px;
        flex-direction: column;
        padding-bottom: 4px;
        z-index: 3;
      }
      .choices.active {
        display: flex;
      }
      .choice {
        width: 100%;
        padding: 16px 18px;
        font-size: 0.71rem;
      }
      .choice-sub {
        display: block;
        margin-top: 5px;
        font-size: 0.56rem;
        letter-spacing: 0.09em;
        color: #7c8589;
      }
      .system {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 48px);
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 0.64rem;
        letter-spacing: 0.28em;
        color: #cbd4d8;
        opacity: 0;
        text-align: center;
        z-index: 4;
      }
      .system.show {
        animation: systemIn 2.5s ease both;
      }
      @keyframes systemIn {
        0% {
          opacity: 0;
          filter: blur(5px);
        }
        25%,
        80% {
          opacity: 1;
          filter: blur(0);
        }
        100% {
          opacity: 0.62;
        }
      }
      #final {
        text-align: center;
        background: radial-gradient(ellipse at center, #171c1f 0%, #080a0b 50%, #020303 100%);
      }
      .final-logo-wrap {
        width: min(30vw, 110px);
        height: min(30vw, 110px);
        margin: 0 auto 28px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: 0 0 30px var(--glow);
        display: grid;
        place-items: center;
        background: #050607;
      }
      .final-logo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .badge {
        font-size: 0.59rem;
        letter-spacing: 0.34em;
        color: var(--cold);
        margin-bottom: 20px;
      }
      .final-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.1rem, 10vw, 3.2rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        margin-bottom: 18px;
        min-height: 1.2em;
      }
      .final-desc {
        font-size: 0.86rem;
        line-height: 1.7;
        color: #aab2b6;
        margin-bottom: 12px;
      }
      .final-echo {
        min-height: 44px;
        white-space: pre-line;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #d6dde0;
        margin-bottom: 16px;
        max-width: 360px;
      }
      .identity-form {
        display: none;
        width: min(100%, 360px);
        gap: 14px;
        flex-direction: column;
        margin: 2px auto 16px;
        text-align: left;
      }
      .identity-form.active {
        display: flex;
      }
      .identity-question {
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        color: var(--cold);
        line-height: 1.5;
      }
      .identity-field {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: rgba(12, 15, 17, 0.58);
        color: var(--white);
        padding: 0 15px;
        font-size: 16px;
        letter-spacing: 0.04em;
        outline: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .identity-field:focus {
        border-color: var(--line-strong);
        box-shadow: 0 0 18px var(--glow);
      }
      .identity-field.invalid {
        border-color: rgba(235, 150, 150, 0.75);
      }
      .identity-hint {
        min-height: 1.2em;
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        color: #c9a7a7;
        line-height: 1.4;
      }
      .result {
        font-size: 0.56rem;
        letter-spacing: 0.18em;
        color: #687176;
        margin-bottom: 16px;
        line-height: 1.8;
      }
      .claim-status {
        font-size: 0.6rem;
        letter-spacing: 0.22em;
        color: #687176;
        margin-bottom: 16px;
        min-height: 1.2em;
      }
      .final-meta {
        margin-top: 18px;
        font-size: 0.53rem;
        letter-spacing: 0.18em;
        color: #596166;
      }
      .reveal-glitch {
        animation: revealGlitch 0.18s steps(2, end) 4;
      }
      @keyframes revealGlitch {
        0% {
          transform: translateX(0);
          text-shadow: none;
        }
        25% {
          transform: translateX(-2px);
          text-shadow: 2px 0 rgba(255, 255, 255, 0.15);
        }
        50% {
          transform: translateX(2px);
        }
        75% {
          transform: translateX(-1px);
        }
        100% {
          transform: translateX(0);
        }
      }
      @media (min-width: 700px) {
        .screen {
          padding-left: 48px;
          padding-right: 48px;
        }
        .scene-index {
          left: 48px;
        }
        .trace {
          right: 48px;
        }
        .choices {
          flex-direction: row;
        }
        .choice {
          flex: 1;
        }
        .crystal-stage {
          bottom: 26%;
          width: min(50vw, 400px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="game" aria-live="polite">
      <div id="grain"></div>
      <canvas id="particles"></canvas>
      <div class="vignette" id="vignette"></div>
      <div id="distort"></div>
      <div class="flash" id="flash"></div>

      <section id="loading" class="screen active" aria-label="Carregamento">
        <div class="loading-mark">KALLISTIS</div>
        <div class="loading-track"><div class="loading-fill" id="loadingFill"></div></div>
        <div class="loading-copy" id="loadingCopy">ABRINDO A FRESTA</div>
      </section>

      <section id="title" class="screen" aria-label="Tela inicial">
        <div class="eyebrow">O CHAMADO</div>
        <h1 class="title-brand">
          <picture>
            <source srcset="/convite/crystal/optimized/WORDMARK.webp" type="image/webp" />
            <img
              class="wordmark"
              src="/convite/crystal/WORDMARK.png"
              alt="KALLISTIS"
              width="960"
              height="640"
            />
          </picture>
        </h1>
        <div class="subtitle">O CHAMADO</div>
        <button class="action glow" id="startBtn">ENTRAR</button>
      </section>

      <section id="scene" class="screen scene" aria-label="Experiência narrativa">
        <div class="scene-index" id="sceneIndex">FRESTA / 01</div>
        <div class="trace" id="trace"></div>
        <div class="crystal-stage" id="crystalStage" aria-hidden="true">
          <picture
            id="crystalPicture"
            style="display: none; height: 100%; max-height: 100%; width: auto; max-width: 100%"
          >
            <source id="crystalSourceWebp" type="image/webp" />
            <img id="crystalArt" class="crystal-art" alt="" decoding="async" />
          </picture>
          <div class="rift" id="rift"></div>
        </div>
        <div class="mark" id="mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="28" />
            <path d="M50 7 L50 33 M50 67 L50 93 M7 50 L33 50 M67 50 L93 50" />
            <polygon points="50,22 72,50 50,78 28,50" />
            <path d="M36 36 L64 64 M64 36 L36 64" />
          </svg>
        </div>
        <div class="system" id="systemMessage">RESSONÂNCIA DETECTADA</div>
        <div class="dialog" id="dialog">
          <div class="speaker" id="speaker">NARRADOR</div>
          <div class="dialog-text" id="dialogText"></div>
          <div class="tap-hint" id="tapHint">TOQUE PARA CONTINUAR</div>
        </div>
        <div class="choices" id="choices"></div>
      </section>

      <section id="final" class="screen" aria-label="Tela final">
        <div class="final-logo-wrap" aria-hidden="true">
          <picture id="logoPicture" style="display: none">
            <source id="logoSourceWebp" type="image/webp" />
            <img id="finalLogo" class="final-logo" alt="KALLISTIS Logo" decoding="async" />
          </picture>
        </div>
        <div class="badge" id="badgeLabel">PASSAGEM RECONHECIDA</div>
        <h2 class="final-title" id="playerLabel">· · ·</h2>
        <p class="final-desc">A Fresta reconheceu sua passagem.</p>
        <p class="final-echo" id="finalEcho"></p>
        <div class="result" id="result"></div>
        <div class="identity-form" id="identityForm" aria-label="Identificação pessoal">
          <label class="identity-question" for="identityName">COMO DEVEM CHAMAR VOCÊ?</label>
          <input
            class="identity-field"
            id="identityName"
            name="name"
            type="text"
            autocomplete="name"
            maxlength="60"
            required
            aria-describedby="identityHint"
          />
          <label class="identity-question" for="identityPronoun">QUAIS SÃO SEUS PRONOMES?</label>
          <input
            class="identity-field"
            id="identityPronoun"
            name="pronoun"
            type="text"
            maxlength="40"
            required
            aria-describedby="identityHint"
          />
          <div class="identity-hint" id="identityHint" role="alert"></div>
        </div>
        <div class="claim-status" id="claimStatus"></div>
        <button class="action glow" id="crossBtn" hidden>ATRAVESSAR</button>
        <div class="final-meta" id="finalMeta"></div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";
        var $ = function (id) {
          return document.getElementById(id);
        };
        var acceptedInvite = new URLSearchParams(location.search).get("accepted") === "1";

        /* ASSET LOADER */
        function loadCrystal() {
          var pic = $("crystalPicture"),
            src = $("crystalSourceWebp"),
            img = $("crystalArt");
          src.srcset = "/convite/crystal/optimized/cristal.webp";
          img.src = "/convite/crystal/cristal.png";
          pic.style.display = "";
        }
        function loadLogo() {
          var pic = $("logoPicture"),
            src = $("logoSourceWebp"),
            img = $("finalLogo");
          src.srcset = "/convite/crystal/optimized/logo.webp";
          img.src = "/convite/crystal/logo.png";
          pic.style.display = "";
        }

        /* SCREENS */
        var screens = ["loading", "title", "scene", "final"];
        function show(id) {
          screens.forEach(function (n) {
            $(n).classList.toggle("active", n === id);
          });
        }

        /* HAPTIC */
        function haptic(ms) {
          ms = ms || 20;
          try {
            if (navigator.vibrate) navigator.vibrate(ms);
          } catch (e) {}
        }

        /* AUDIO ENGINE */
        var AudioEngine = (function () {
          var ctx = null,
            master = null,
            on = false,
            schedulerTimer = null;
          var SCALE = [65.41, 77.78, 87.31, 98.0, 116.54, 130.81, 155.56, 174.61];

          function ensureCtx() {
            if (ctx) return true;
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return false;
            ctx = new C();
            master = ctx.createGain();
            master.gain.value = 0;
            master.connect(ctx.destination);
            _buildDrone();
            _buildNoise();
            return true;
          }

          function _buildDrone() {
            var o = ctx.createOscillator(),
              g = ctx.createGain(),
              lp = ctx.createBiquadFilter();
            o.type = "sine";
            o.frequency.value = 54;
            lp.type = "lowpass";
            lp.frequency.value = 180;
            g.gain.value = 0.09;
            o.connect(lp);
            lp.connect(g);
            g.connect(master);
            o.start();
            var lfo = ctx.createOscillator(),
              lg = ctx.createGain();
            lfo.frequency.value = 0.08;
            lg.gain.value = 0.04;
            lfo.connect(lg);
            lg.connect(g.gain);
            lfo.start();
          }

          function _buildNoise() {
            var len = ctx.sampleRate * 3,
              buf = ctx.createBuffer(1, len, ctx.sampleRate),
              arr = buf.getChannelData(0);
            for (var i = 0; i < len; i++) arr[i] = (Math.random() * 2 - 1) * 0.18;
            var n = ctx.createBufferSource(),
              lp = ctx.createBiquadFilter(),
              g = ctx.createGain();
            n.buffer = buf;
            n.loop = true;
            lp.type = "lowpass";
            lp.frequency.value = 320;
            g.gain.value = 0.015;
            n.connect(lp);
            lp.connect(g);
            g.connect(master);
            n.start();
          }

          function _scheduleNote() {
            if (!ctx || !on) return;
            var freq = SCALE[Math.floor(Math.random() * SCALE.length)];
            var when = ctx.currentTime + 0.05;
            var dur = Math.random() * 1.2 + 0.5;
            var sq = ctx.createOscillator(),
              sqg = ctx.createGain(),
              hp = ctx.createBiquadFilter();
            sq.type = "square";
            sq.frequency.value = freq;
            hp.type = "highpass";
            hp.frequency.value = 60;
            sqg.gain.setValueAtTime(0.0, when);
            sqg.gain.linearRampToValueAtTime(0.025, when + 0.04);
            sqg.gain.exponentialRampToValueAtTime(0.001, when + dur);
            sq.connect(hp);
            hp.connect(sqg);
            sqg.connect(master);
            sq.start(when);
            sq.stop(when + dur + 0.05);
            if (Math.random() < 0.45) {
              var mf = freq * (Math.random() < 0.5 ? 2 : 4);
              var mo = ctx.createOscillator(),
                mg = ctx.createGain();
              mo.type = "triangle";
              mo.frequency.value = mf;
              mg.gain.setValueAtTime(0.0, when + 0.1);
              mg.gain.linearRampToValueAtTime(0.012, when + 0.14);
              mg.gain.exponentialRampToValueAtTime(0.001, when + dur * 0.6);
              mo.connect(mg);
              mg.connect(master);
              mo.start(when + 0.1);
              mo.stop(when + dur);
            }
            var next = (Math.random() * 3.7 + 1.8) * 1000;
            schedulerTimer = setTimeout(_scheduleNote, next);
          }

          return {
            set: async function (state) {
              if (!ensureCtx()) return;
              if (ctx.state === "suspended")
                try {
                  await ctx.resume();
                } catch (e) {}
              on = state;
              var t = ctx.currentTime;
              master.gain.cancelScheduledValues(t);
              master.gain.linearRampToValueAtTime(state ? 0.42 : 0, t + 0.2);
              if (state) {
                clearTimeout(schedulerTimer);
                _scheduleNote();
              } else {
                clearTimeout(schedulerTimer);
                schedulerTimer = null;
              }
            },
            isOn: function () {
              return on;
            },
            ping: function (freq, dur, vol) {
              freq = freq || 620;
              dur = dur || 0.09;
              vol = vol || 0.025;
              if (!ctx || !on) return;
              var o = ctx.createOscillator(),
                g = ctx.createGain();
              o.type = "sine";
              o.frequency.value = freq;
              g.gain.setValueAtTime(vol, ctx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
              o.connect(g);
              g.connect(master);
              o.start();
              o.stop(ctx.currentTime + dur);
            },
            swell: function () {
              if (!ctx || !on) return;
              var o = ctx.createOscillator(),
                g = ctx.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(110, ctx.currentTime);
              o.frequency.exponentialRampToValueAtTime(330, ctx.currentTime + 0.7);
              g.gain.setValueAtTime(0.001, ctx.currentTime);
              g.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.22);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
              o.connect(g);
              g.connect(master);
              o.start();
              o.stop(ctx.currentTime + 1);
            },
            sfxEnter: function () {
              if (!ctx || !on) return;
              var o = ctx.createOscillator(),
                g = ctx.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(330, ctx.currentTime);
              o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.18);
              g.gain.setValueAtTime(0.032, ctx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
              o.connect(g);
              g.connect(master);
              o.start();
              o.stop(ctx.currentTime + 0.3);
            },
            sfxCrystalContact: function () {
              if (!ctx || !on) return;
              var o = ctx.createOscillator(),
                g = ctx.createGain(),
                lp = ctx.createBiquadFilter();
              o.type = "sawtooth";
              o.frequency.value = 220;
              lp.type = "lowpass";
              lp.frequency.value = 800;
              g.gain.setValueAtTime(0.0, ctx.currentTime);
              g.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.03);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
              o.connect(lp);
              lp.connect(g);
              g.connect(master);
              o.start();
              o.stop(ctx.currentTime + 0.95);
            },
            sfxResonance: function () {
              if (!ctx || !on) return;
              [0, 0.12, 0.26].forEach(function (delay, i) {
                var o = ctx.createOscillator(),
                  g = ctx.createGain();
                o.type = "sine";
                o.frequency.value = 440 * (i === 0 ? 1 : i === 1 ? 1.25 : 1.5);
                var t = ctx.currentTime + delay;
                g.gain.setValueAtTime(0.028 - i * 0.006, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
                o.connect(g);
                g.connect(master);
                o.start(t);
                o.stop(t + 0.6);
              });
            },
            sfxIdentityReveal: function () {
              if (!ctx || !on) return;
              [262, 330, 392, 523, 659, 784].forEach(function (freq, i) {
                var o = ctx.createOscillator(),
                  g = ctx.createGain();
                o.type = "square";
                o.frequency.value = freq;
                var t = ctx.currentTime + i * 0.09;
                g.gain.setValueAtTime(0.028, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                o.connect(g);
                g.connect(master);
                o.start(t);
                o.stop(t + 0.32);
              });
            },
            sfxCrossing: function () {
              if (!ctx || !on) return;
              var o = ctx.createOscillator(),
                g = ctx.createGain(),
                lp = ctx.createBiquadFilter();
              o.type = "sine";
              o.frequency.setValueAtTime(220, ctx.currentTime);
              o.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 1.2);
              lp.type = "lowpass";
              lp.frequency.value = 600;
              g.gain.setValueAtTime(0.055, ctx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
              o.connect(lp);
              lp.connect(g);
              g.connect(master);
              o.start();
              o.stop(ctx.currentTime + 1.5);
            },
          };
        })();

        /* SCENE SYSTEM */
        var phase = "threshold",
          line = 0,
          typing = false,
          complete = false,
          timer = null;
        var memory = { listen: 0, touch: 0, advance: 0, hesitate: 0, choices: [] };
        var scenes = {
          threshold: {
            index: "FRESTA / 01",
            stage: 1,
            lines: [
              "Há uma passagem onde não deveria existir nenhuma.",
              "Você não consegue ver o fim.",
            ],
            choices: [
              { label: "ENTRAR", sub: "dar o primeiro passo", next: "echo", effect: "advance" },
              {
                label: "ESPERAR",
                sub: "deixar o túnel responder primeiro",
                next: "echo",
                effect: "hesitate",
              },
            ],
          },
          echo: {
            index: "FRESTA / 02",
            stage: 2,
            lines: ["O som chega antes da luz.", "Não parece vir da frente. Nem de trás."],
            choices: [
              { label: "ESCUTAR", sub: "seguir o eco", next: "stone", effect: "listen" },
              { label: "SEGUIR O BRILHO", sub: "ignorar o som", next: "stone", effect: "advance" },
            ],
          },
          stone: {
            index: "FRESTA / 03",
            stage: 2,
            lines: [
              "A pedra na parede pulsa quando você se aproxima.",
              "Uma fissura acompanha sua respiração.",
            ],
            choices: [
              { label: "TOCAR", sub: "aceitar o contato", next: "answer", effect: "touch" },
              {
                label: "CONTINUAR",
                sub: "não interromper a passagem",
                next: "answer",
                effect: "advance",
              },
            ],
          },
          answer: {
            index: "FRESTA / 04",
            stage: 3,
            system: "RESSONÂNCIA DETECTADA",
            mark: true,
            lines: [
              function () {
                return memory.touch
                  ? "A pedra responde antes que você retire a mão."
                  : "A fissura se abre um pouco mais quando você passa.";
              },
              function () {
                return memory.listen
                  ? "O eco agora parece pronunciar alguma coisa."
                  : "O silêncio ganha peso.";
              },
              "Alguma coisa do outro lado percebeu você.",
            ],
            choices: [
              {
                label: "RESPONDER",
                sub: "deixar que ela saiba que você ouviu",
                next: "recognition",
                effect: "listen",
              },
              {
                label: "ATRAVESSAR",
                sub: "não esperar por outra resposta",
                next: "recognition",
                effect: "advance",
              },
            ],
          },
          recognition: {
            index: "FRESTA / 05",
            stage: 4,
            system: "PASSAGEM RECONHECIDA",
            mark: true,
            lines: [
              function () {
                return recognitionLine();
              },
              "A abertura permanece estável por alguns segundos.",
            ],
          },
        };

        function recognitionLine() {
          if (memory.listen >= 2) return "Você não encontrou uma saída. Encontrou uma resposta.";
          if (memory.touch >= 1) return "A marca na pedra desaparece. A sensação na sua mão, não.";
          if (memory.advance >= 3) return "Você atravessou antes que o túnel decidisse fechar.";
          if (memory.hesitate >= 1) return "A Fresta esperou. Você também. Uma das duas cedeu.";
          return "A passagem reconheceu sua presença.";
        }
        function dominant() {
          var e = [
            ["ECO", memory.listen],
            ["CONTATO", memory.touch],
            ["IMPULSO", memory.advance],
            ["ESPERA", memory.hesitate],
          ].sort(function (a, b) {
            return b[1] - a[1];
          });
          return e[0][1] ? e[0][0] : "INDEFINIDA";
        }
        function finalLine() {
          var d = dominant();
          if (d === "ECO") return "Você escutou até o silêncio responder.";
          if (d === "CONTATO") return "Você tocou o que não compreendia.";
          if (d === "IMPULSO") return "Você seguiu quando a passagem ainda estava se formando.";
          if (d === "ESPERA") return "Você esperou até a Fresta fazer o primeiro movimento.";
          return "Sua passagem deixou um eco difícil de nomear.";
        }

        function resolveLine(v) {
          return typeof v === "function" ? v() : v;
        }
        function type(text) {
          clearInterval(timer);
          var el = $("dialogText");
          el.textContent = "";
          typing = true;
          complete = false;
          $("tapHint").classList.remove("show");
          var i = 0;
          timer = setInterval(function () {
            el.textContent = text.slice(0, ++i);
            if (i >= text.length) {
              clearInterval(timer);
              typing = false;
              complete = true;
              $("tapHint").classList.add("show");
            }
          }, 22);
        }
        function finishTyping() {
          clearInterval(timer);
          var data = scenes[phase];
          $("dialogText").textContent = resolveLine(data.lines[line]);
          typing = false;
          complete = true;
          $("tapHint").classList.add("show");
        }
        function setRift(stage) {
          $("rift").className = "rift" + (stage > 1 ? " stage-" + stage : "");
          var c = $("crystalStage");
          if (c) c.className = "crystal-stage" + (stage > 1 ? " stage-" + stage : "");
        }
        function flashFx() {
          var f = $("flash");
          f.classList.remove("hit");
          void f.offsetWidth;
          f.classList.add("hit");
        }
        function distortFx() {
          var d = $("distort");
          d.classList.remove("active");
          void d.offsetWidth;
          d.classList.add("active");
        }
        function updateTrace() {
          $("trace").textContent = memory.choices.length
            ? "ECO // " + String(memory.choices.length).padStart(2, "0")
            : "";
        }
        function react(effect) {
          var r = $("rift");
          var c = "react-" + effect;
          r.classList.remove(c);
          void r.offsetWidth;
          r.classList.add(c);
          setTimeout(function () {
            r.classList.remove(c);
          }, 1200);
          if (effect === "touch") {
            flashFx();
            AudioEngine.sfxCrystalContact();
          }
          if (effect === "listen") {
            distortFx();
            AudioEngine.sfxResonance();
          }
          if (effect === "advance") {
            $("vignette").style.opacity = ".65";
            setTimeout(function () {
              $("vignette").style.opacity = "1";
            }, 420);
          }
          if (effect === "hesitate") {
            $("vignette").style.background =
              "radial-gradient(circle at center,transparent 22%,rgba(0,0,0,.5) 64%,rgba(0,0,0,.88) 100%)";
            setTimeout(function () {
              $("vignette").style.background = "";
            }, 950);
          }
        }
        function renderScene(key) {
          phase = key;
          line = 0;
          var data = scenes[key];
          show("scene");
          $("sceneIndex").textContent = data.index;
          $("choices").classList.remove("active");
          $("choices").innerHTML = "";
          $("dialog").style.display = "block";
          $("systemMessage").classList.remove("show");
          setRift(data.stage || 1);
          updateTrace();
          $("mark").classList.toggle("show", !!data.mark);
          if (key === "recognition") {
            loadLogo();
          }
          if (data.system) {
            $("systemMessage").textContent = data.system;
            setTimeout(function () {
              $("systemMessage").classList.add("show");
              AudioEngine.ping(key === "recognition" ? 880 : 740, 0.18, 0.02);
              if (key === "recognition") {
                flashFx();
                distortFx();
              }
            }, 250);
          }
          type(resolveLine(data.lines[0]));
        }
        function applyEffect(effect, label) {
          if (effect && effect in memory) memory[effect]++;
          memory.choices.push(label);
          haptic(effect === "touch" ? 35 : 18);
          react(effect);
        }
        function showChoices() {
          var data = scenes[phase],
            box = $("choices");
          $("dialog").style.display = "none";
          box.innerHTML = "";
          data.choices.forEach(function (c) {
            var b = document.createElement("button");
            b.className = "choice";
            b.innerHTML =
              "<span>" +
              c.label +
              "</span>" +
              (c.sub ? '<span class="choice-sub">' + c.sub + "</span>" : "");
            b.addEventListener("click", function () {
              applyEffect(c.effect, c.label);
              AudioEngine.ping(c.effect === "touch" ? 420 : 660, 0.11, 0.025);
              renderScene(c.next);
            });
            box.appendChild(b);
          });
          box.classList.add("active");
        }
        function advance() {
          if (typing) {
            finishTyping();
            return;
          }
          if (!complete) return;
          var data = scenes[phase];
          if (line < data.lines.length - 1) {
            line++;
            AudioEngine.ping(510, 0.05, 0.016);
            type(resolveLine(data.lines[line]));
            return;
          }
          if (data.choices) {
            complete = false;
            showChoices();
            return;
          }
          complete = false;
          setTimeout(enterFinalScreen, 350);
        }

        /* FINAL SCREEN (pre-claim) */
        function enterFinalScreen() {
          loadLogo();
          $("badgeLabel").textContent = "PASSAGEM RECONHECIDA";
          $("playerLabel").textContent = "· · ·";
          $("finalEcho").textContent = finalLine();
          $("result").textContent = "RESSONÂNCIA // " + dominant() + "  ·  MARCA // REGISTRADA";
          $("claimStatus").textContent = "";
          $("identityForm").classList.add("active");
          $("identityName").value = "";
          $("identityPronoun").value = "";
          $("identityHint").textContent = "";
          $("crossBtn").textContent = "ATRAVESSAR";
          $("crossBtn").disabled = false;
          $("crossBtn").hidden = false;
          $("finalMeta").textContent = "";
          AudioEngine.sfxResonance();
          show("final");
        }

        async function performClaim() {
          if (acceptedInvite) {
            location.href = "/perfil?gravewright=1";
            return;
          }
          var btn = $("crossBtn");
          var name = $("identityName").value.trim();
          var pronoun = $("identityPronoun").value.trim();
          $("identityName").classList.toggle("invalid", !name);
          $("identityPronoun").classList.toggle("invalid", !pronoun);
          if (!name || !pronoun) {
            $("identityHint").textContent = "A PASSAGEM AINDA NÃO SABE COMO CHAMAR VOCÊ.";
            return;
          }
          $("identityHint").textContent = "";
          btn.disabled = true;
          btn.textContent = "ATRAVESSANDO...";
          $("claimStatus").textContent = "";
          AudioEngine.sfxCrossing();
          haptic([20, 30, 40]);

          var resp, data;
          try {
            resp = await fetch("/api/invite", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "start_google",
                display_name: name,
                pronouns: pronoun,
              }),
            });
            data = await resp.json();
          } catch (err) {
            claimError();
            return;
          }

          if (resp.status === 200 && data.state && data.oauth_url) {
            sessionStorage.setItem("kallistis_invite_name", name);
            sessionStorage.setItem("kallistis_invite_pronoun", pronoun);
            location.href = data.oauth_url;
          } else if (resp.status === 409) {
            claimExhausted();
          } else {
            $("claimStatus").textContent =
              data.error === "invite_server_failure"
                ? "NÃO FOI POSSÍVEL CONCLUIR AGORA."
                : "NÃO FOI POSSÍVEL ABRIR A PASSAGEM.";
            btn.disabled = false;
            btn.textContent = "TENTAR NOVAMENTE";
          }
        }

        function claimSuccess(slot, playerLabel) {
          AudioEngine.sfxIdentityReveal();
          $("badgeLabel").textContent = "IDENTIFICAÇÃO CONCLUÍDA";
          $("identityForm").classList.remove("active");
          var el = $("playerLabel");
          var steps = ["IDENTIDADE: —", "JOGADOR-__", "JOGADOR-" + slot[0] + "_", playerLabel];
          var i = 0;
          el.textContent = steps[0];
          function run() {
            el.classList.remove("reveal-glitch");
            void el.offsetWidth;
            el.classList.add("reveal-glitch");
            el.textContent = steps[i];
            AudioEngine.ping(420 + i * 120, 0.08, 0.02);
            if (i < steps.length - 1) {
              i++;
              setTimeout(run, i === 3 ? 520 : 360);
            } else {
              haptic([25, 35, 45]);
              AudioEngine.swell();
              $("crossBtn").textContent = "PASSAGEM ABERTA";
              $("crossBtn").hidden = true;
              $("finalMeta").textContent = "CHAMADO // REGISTRADO";
              $("finalEcho").textContent =
                $("identityName").value.trim() +
                "  ·  " +
                $("identityPronoun").value.trim() +
                "\n\n" +
                finalLine();
            }
          }
          setTimeout(run, 250);
        }

        function claimExhausted() {
          $("claimStatus").textContent = "NENHUMA IDENTIDADE DISPONÍVEL.";
          $("crossBtn").disabled = true;
          $("crossBtn").textContent = "ATRAVESSAR";
        }

        function claimError() {
          $("claimStatus").textContent = "NÃO FOI POSSÍVEL CONCLUIR A PASSAGEM.";
          $("crossBtn").disabled = false;
          $("crossBtn").textContent = "TENTAR NOVAMENTE";
        }

        function showAccepted() {
          loadLogo();
          $("badgeLabel").textContent = "IDENTIFICAÇÃO CONCLUÍDA";
          $("playerLabel").textContent = "PASSAGEM ABERTA";
          $("finalEcho").textContent =
            (sessionStorage.getItem("kallistis_invite_name") || "") +
            "  ·  " +
            (sessionStorage.getItem("kallistis_invite_pronoun") || "") +
            "\n\nSeu acesso a KALLISTIS está pronto. Gere sua frase pessoal para entrar no Gravewright.";
          $("result").textContent = "KALLISTIS // PRONTO · GRAVEWRIGHT // ACESSO PESSOAL";
          $("identityForm").classList.remove("active");
          $("claimStatus").textContent = "";
          $("crossBtn").hidden = false;
          $("crossBtn").disabled = false;
          $("crossBtn").textContent = "GERAR FRASE DO GRAVEWRIGHT";
          $("finalMeta").textContent = "A FRASE PESSOAL SERÁ MOSTRADA NO SEU PERFIL";
          show("final");
        }

        $("crossBtn").addEventListener("click", performClaim);

        /* START */
        $("startBtn").addEventListener(
          "pointerdown",
          function () {
            AudioEngine.set(true);
          },
          { once: true },
        );
        $("startBtn").addEventListener("click", async function () {
          loadCrystal();
          await AudioEngine.set(true);
          AudioEngine.sfxEnter();
          haptic(18);
          renderScene("threshold");
        });
        $("scene").addEventListener("click", function (e) {
          if (e.target.closest("button")) return;
          advance();
        });

        /* PARTICLES */
        var canvas = $("particles"),
          ctx2d = canvas.getContext("2d");
        var dust = [];
        function size() {
          var d = Math.min(devicePixelRatio || 1, 2);
          canvas.width = innerWidth * d;
          canvas.height = innerHeight * d;
          canvas.style.width = innerWidth + "px";
          canvas.style.height = innerHeight + "px";
          ctx2d.setTransform(d, 0, 0, d, 0, 0);
          dust = Array.from({ length: 44 }, function () {
            return {
              x: Math.random() * innerWidth,
              y: Math.random() * innerHeight,
              r: Math.random() * 1.25 + 0.18,
              v: Math.random() * 0.12 + 0.025,
              a: Math.random() * 0.2 + 0.035,
              sway: (Math.random() - 0.5) * 0.035,
            };
          });
        }
        function draw() {
          ctx2d.clearRect(0, 0, innerWidth, innerHeight);
          dust.forEach(function (p) {
            p.y -= p.v;
            p.x += p.sway;
            if (p.y < 0) {
              p.y = innerHeight;
              p.x = Math.random() * innerWidth;
            }
            if (p.x < 0) p.x = innerWidth;
            if (p.x > innerWidth) p.x = 0;
            ctx2d.beginPath();
            ctx2d.fillStyle = "rgba(220,232,236," + p.a + ")";
            ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx2d.fill();
          });
          requestAnimationFrame(draw);
        }
        addEventListener("resize", size);
        size();
        draw();

        /* BOOT */
        requestAnimationFrame(function () {
          $("loadingFill").style.width = "100%";
        });
        setTimeout(function () {
          $("loadingCopy").textContent = "PASSAGEM LOCALIZADA";
          setTimeout(function () {
            if (acceptedInvite) showAccepted();
            else show("title");
          }, 350);
        }, 700);
      })();
    </script>
  </body>
</html>
