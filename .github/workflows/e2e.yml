name: E2E autenticado real

on:
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: URL do preview a validar
        required: true
        type: string

  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  authenticated-core-flow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'run-real-e2e'))
    runs-on: ubuntu-latest
    environment: kaline-e2e
    env:
      E2E_BASE_URL: ${{ inputs.e2e_base_url || vars.E2E_BASE_URL }}
      E2E_CLOUDFLARE_ACCOUNT: ${{ vars.E2E_CLOUDFLARE_ACCOUNT }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run authenticated E2E
        run: bun run test:e2e
